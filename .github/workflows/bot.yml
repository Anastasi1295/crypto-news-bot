name: Crypto News Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждые 4 часа
  workflow_dispatch: # Ручной запуск

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Разрешения для работы с артефактами (по умолчанию достаточно, но явно укажем)
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download state artifacts
        uses: actions/download-artifact@v4
        with:
          name: bot-state
          path: .
        continue-on-error: true # Если это первый запуск, артефакта еще нет, это нормально
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
      
      - name: Upload state artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bot-state
          # Сохраняем оба файла состояния
          path: |
            sent_news.json
            sent_news_cache.json
          retention-days: 30 # 30 дней более чем достаточно для кэша
          overwrite: true
